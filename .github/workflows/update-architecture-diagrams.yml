# Keeps the code-generated architecture images (static/img/architecture/*) in sync with their
# Python source (diagrams/src/*.py). Mirrors the ERD-index workflow: regenerate on change +
# on demand, and open a PR if the rendered images differ from what's committed — rather than a
# hard PR gate, because Graphviz output is not byte-identical across `dot` versions (a blocking
# gate would flake on coordinate noise). The images are committed so GitHub Pages serves them
# without a build-time Graphviz dependency. Uses GITOPS_TOKEN (same as the ERD workflow).
name: Update architecture diagrams
on:
  push:
    branches: [main]
    paths:
      - 'diagrams/**'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Render diagrams
        working-directory: diagrams
        run: make generate
      - name: Open a PR if the images changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if git diff --quiet -- static/img/architecture; then
            echo "Diagrams already up to date — nothing to do"; exit 0
          fi
          git config user.name  "ktayl-docs-bot"
          git config user.email "bot@devandre.sbs"
          BR="chore/architecture-diagrams-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git commit -am "docs: refresh code-generated architecture diagrams"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs: refresh architecture diagrams (auto)" \
            --body "Regenerated by \`diagrams/\` (mingrammer diagrams + Graphviz) after a source change. Review the rendered image, then squash-merge."
