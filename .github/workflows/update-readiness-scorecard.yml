# Keeps the Service Readiness Scorecard (engineering-standards/service-readiness) in sync with reality —
# no manual per-repo step. It aggregates across the WHOLE org (a new repo / a newly-added README / CI /
# catalog-info appears here on its own), so it can't be a per-PR gate on this repo; instead it regenerates
# on a schedule + on demand and opens a PR when any score changed. Also refreshes the machine-readable
# static/data/readiness-scorecard.json that the Backstage tech-insights scorecard reads. Uses GITOPS_TOKEN
# (org read) because the default GITHUB_TOKEN can't read other repos' git trees. Mirrors update-adr-index.yml.
name: Update readiness scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the readiness scorecard (table + JSON)
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: python3 scripts/gen-readiness-scorecard.py
      - name: Open a PR if the scorecard changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if git diff --quiet; then echo "Scorecard already up to date — nothing to do"; exit 0; fi
          git config user.name  "ktayl-docs-bot"
          git config user.email "bot@devandre.sbs"
          BR="chore/readiness-scorecard-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git commit -am "docs: refresh auto-generated service readiness scorecard"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs: refresh service readiness scorecard (auto)" \
            --body "Auto-generated by \`scripts/gen-readiness-scorecard.py\` (scheduled/dispatch). Review the score changes, then squash-merge."
