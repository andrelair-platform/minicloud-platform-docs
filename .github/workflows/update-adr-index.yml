# Keeps the org decision-record (ADR) index (engineering-standards/decision-records) in sync with reality
# — no manual per-repo pointer step. It aggregates across the WHOLE org (a new ADR in any repo appears
# here on its own), so it can't be a per-PR gate on this repo; instead it regenerates on a schedule + on
# demand and opens a PR when the set of decision records changed. Uses GITOPS_TOKEN (org read) because the
# default GITHUB_TOKEN can't read other repos' git trees. Mirrors update-erd-index.yml.
name: Update ADR index
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the ADR index table
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: python3 scripts/gen-adr-index.py
      - name: Open a PR if the index changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if git diff --quiet; then echo "ADR index already up to date — nothing to do"; exit 0; fi
          git config user.name  "ktayl-docs-bot"
          git config user.email "bot@devandre.sbs"
          BR="chore/adr-index-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git commit -am "docs: refresh auto-generated ADR index"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs: refresh ADR index (auto)" \
            --body "Auto-generated by \`scripts/gen-adr-index.py\` (scheduled/dispatch). Review the added/removed decision records, then squash-merge."
