# Keeps the SI Delivery Board (docs-is/delivery-board) in sync with reality — the living "what's built vs
# what's still to build" view, so a manual gap analysis is never needed. It joins three gh-only sources
# (GitHub product boards = target · gitops apps/** = deployed · repo sizes = code-vs-scaffold), so it runs
# without cluster access. Aggregates across the org, so it can't be a per-PR gate; it regenerates on a
# schedule + on demand and opens a PR when the status changed. Uses GITOPS_TOKEN (org + project read).
# Mirrors update-adr-index.yml.
name: Update SI delivery board
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the SI delivery board
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: python3 scripts/gen-si-delivery.py
      - name: Open a PR if the board changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if git diff --quiet; then echo "SI delivery board already up to date — nothing to do"; exit 0; fi
          git config user.name  "ktayl-docs-bot"
          git config user.email "bot@devandre.sbs"
          BR="chore/si-delivery-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git commit -am "docs: refresh auto-generated SI delivery board"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs: refresh SI delivery board (auto)" \
            --body "Auto-generated by \`scripts/gen-si-delivery.py\` (scheduled/dispatch). Review the status changes, then squash-merge."
