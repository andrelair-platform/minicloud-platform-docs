# Keeps the org ERD index (insurance-platform/schema-erd-autogenerated) in sync with reality — no manual
# per-service step. It aggregates across the WHOLE org (a new DB repo's data-model appears here on its
# own), so it can't be a per-PR gate on this repo; instead it regenerates on a schedule + on demand and
# opens a PR when the set of DB repos / their table counts changed. Uses GITOPS_TOKEN (org read) because
# the default GITHUB_TOKEN can't read other repos' git trees.
name: Update ERD index
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the ERD index table
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: python3 scripts/gen-erd-index.py
      - name: Open a PR if the index changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if git diff --quiet; then echo "ERD index already up to date — nothing to do"; exit 0; fi
          git config user.name  "ktayl-docs-bot"
          git config user.email "bot@devandre.sbs"
          BR="chore/erd-index-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git commit -am "docs: refresh auto-generated ERD index"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs: refresh ERD index (auto)" \
            --body "Auto-generated by \`scripts/gen-erd-index.py\` (scheduled/dispatch). Review the added/removed DB repos or changed table counts, then squash-merge."
