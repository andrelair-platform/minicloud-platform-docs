# Keeps the org traceability-matrix index (engineering-standards/documentation-standard) in sync with
# reality — no manual per-product step. Any repo that commits docs/traceability-matrix.md appears on its
# own. Aggregates across the WHOLE org, so it regenerates on a schedule + on demand and opens a PR on
# drift. Uses GITOPS_TOKEN (org read). Mirrors update-adr-index.yml / update-erd-index.yml.
name: Update traceability index
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the traceability index table
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: python3 scripts/gen-trace-index.py
      - name: Open a PR if the index changed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if git diff --quiet; then echo "traceability index already up to date — nothing to do"; exit 0; fi
          git config user.name  "ktayl-docs-bot"
          git config user.email "bot@devandre.sbs"
          BR="chore/trace-index-${GITHUB_RUN_ID}"
          git checkout -b "$BR"
          git commit -am "docs: refresh auto-generated traceability index"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "docs: refresh traceability index (auto)" \
            --body "Auto-generated by \`scripts/gen-trace-index.py\` (scheduled/dispatch). Review the added/removed products, then squash-merge."
